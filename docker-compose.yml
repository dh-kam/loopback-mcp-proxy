services:
  proxy:
    build: .
    image: loopback-mcp-proxy:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BIND: 0.0.0.0:8080
      ALLOW_NON_LOOPBACK: "1"
      DATA_DIR: /data
      PUBLIC_BASE_URL: http://127.0.0.1:8080
    volumes:
      - proxy-data:/data
    restart: unless-stopped

volumes:
  proxy-data:
